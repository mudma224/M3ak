[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "m3ak-service-llm"
version = "0.1.0"
description = "Service llm de la plateforme M3ak"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.1",
  "aio-pika>=9.4",
  "httpx>=0.27",
  "redis>=5.0",
  "m3ak-contracts>=0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
llm = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# La dégradation gracieuse est le pattern assumé de ces modules : toute
# indisponibilité (base, cache, fournisseur) est convertie en état dégradé
# ou en exception typée, jamais en erreur brute non tracée.
"app/db.py" = ["BLE001", "S110"]
"app/quota.py" = ["BLE001", "S110"]
"app/fournisseurs.py" = ["BLE001"]
