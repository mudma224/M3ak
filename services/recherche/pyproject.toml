[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "m3ak-service-recherche"
version = "0.1.0"
description = "Service recherche de la plateforme M3ak"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.1",
  "aio-pika>=9.4",
  "httpx>=0.27",
  "pgvector>=0.3",
  "redis>=5.0",
  "m3ak-contracts>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
recherche = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.migrations" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# /ready doit signaler une base indisponible plutôt que de lever une exception.
"app/db.py" = ["BLE001"]
# La dégradation gracieuse est le pattern assumé de ces modules : toute
# indisponibilité (embeddings, cache) est convertie en mode dégradé, jamais
# en erreur brute.
"app/cache.py" = ["BLE001"]
"app/embeddings.py" = ["BLE001"]
"app/rerank.py" = ["BLE001"]
"app/moteur.py" = ["BLE001"]
"app/backfill.py" = ["BLE001"]
